# Fossify Camera for iOS. Build with `idl build -c release` (see README.md).
toolchain:
  sdk_bundle: ~/.swiftpm/swift-sdks/darwin.artifactbundle
  swiftly_bin: ~/.local/share/swiftly/bin
  swiftc: swiftc
  ldid: ldid
  actool: idl-actool

targets:
  - name: FossifyCamera
    bundle_id: org.fossify.camera.ios
    version: "1.5.0"
    build_number: "1"
    min_ios: "17.0"
    device_family: "1,2"
    link: [CameraKit, FossifyCommons]
    sources: [App]
    resources: [Resources/Assets.xcassets, Resources/CameraSounds.bundle]
    frameworks: [SwiftUI, UIKit, Foundation, AVFoundation, AVKit, Photos, CoreLocation, CoreImage, ImageIO, AudioToolbox, QuickLook]
    swift_version: "5.0"
    info:
      CFBundleDisplayName: Camera
      NSCameraUsageDescription: Camera needs the camera to take photos and videos.
      NSMicrophoneUsageDescription: Camera needs the microphone to record the sound of videos.
      NSPhotoLibraryUsageDescription: Camera saves photos and videos to your library and shows the last one taken.
      NSPhotoLibraryAddUsageDescription: Camera saves photos and videos to your library.
      NSLocationWhenInUseUsageDescription: Camera stores where a photo or video was taken when Save photo and video location is enabled.
      UIFileSharingEnabled: true
      LSSupportsOpeningDocumentsInPlace: true
      UIApplicationSceneManifest:
        UIApplicationSupportsMultipleScenes: false
      UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
    configurations:
      debug:
        entitlements:
          get-task-allow: true

  # Everything but the app entry point; also linked by the launcher (fossify-ios/launcher-ios).
  - name: CameraKit
    type: static
    min_ios: "17.0"
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, AVFoundation, AVKit, Photos, CoreLocation, CoreImage, ImageIO, AudioToolbox, QuickLook]
    swift_version: "5.0"

  # Shared core (fossify-ios/commons-ios), compiled into the app as a static Swift module.
  - name: FossifyCommons
    type: static
    dir: ../commons-ios
    min_ios: "17.0"
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation]
    swift_version: "5.0"
